<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Pod Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: header (title, language, save/open) + tabs; the pod (left tube | 3 materials | right tube) is the recurring visual unit */
:root{
  --bg:#eef1f4; --surface:#ffffff; --raised:#f6f8fa; --ink:#18202a; --muted:#5b6673; --line:#d4dbe2;
  --accent:#0f8f8a; --accent-ink:#ffffff; --gold:#b7791f;
  --good:#1f8a4c; --warn:#b26a00; --bad:#c2352e;
  --display:"Chakra Petch", "Noto Sans Thai", "Noto Sans SC", system-ui, sans-serif;
  --body:"Noto Sans Thai", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1319; --surface:#151c24; --raised:#1b242e; --ink:#e3e9ef; --muted:#93a0ad; --line:#2a3542;
    --accent:#3cc7bf; --accent-ink:#06201f; --gold:#e3a94a;
    --good:#4cc47f; --warn:#e6a23c; --bad:#ef6a62; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --raised:#1b242e; --ink:#e3e9ef; --muted:#93a0ad; --line:#2a3542;
  --accent:#3cc7bf; --accent-ink:#06201f; --gold:#e3a94a;
  --good:#4cc47f; --warn:#e6a23c; --bad:#ef6a62; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.6 var(--body)}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.25}
a{color:var(--accent)}
.wrap{max-width:1180px; margin:0 auto; padding:20px 16px 48px; display:flex; flex-direction:column; gap:18px}
header{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px}
header h1{font-size:28px; letter-spacing:.3px}
header h1 span{color:var(--accent)}
header p{margin:4px 0 0; color:var(--muted); max-width:70ch}
.hdr-tools{display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toolbar{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end}
.tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
.tab{font:600 15px var(--display); background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); padding:8px 14px; cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink); border-color:var(--accent)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent); outline-offset:2px}
.panel{display:none; flex-direction:column; gap:16px}
.panel.on{display:flex}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px}
.grid2{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr} .hdr-tools{align-items:flex-start} .toolbar{justify-content:flex-start}}
label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted)}
select,input[type=text],input[type=number],textarea{font:inherit; font-size:14px; color:var(--ink); background:var(--raised); border:1px solid var(--line); border-radius:7px; padding:7px 9px; width:100%}
textarea{min-height:180px; font-family:ui-monospace, Consolas, monospace; font-size:12px}
.form{display:flex; flex-direction:column; gap:12px}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row>*{flex:1 1 120px}
.btn{font:600 14px var(--display); border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:8px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.btn.ghost{background:transparent; color:var(--accent)}
.btn.sm{padding:4px 10px; font-size:13px}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{flex:1; font:500 13px var(--body); padding:6px 10px; border:0; background:var(--raised); color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.note{font-size:13px; color:var(--muted)}
.warn{border-left:4px solid var(--warn); background:color-mix(in srgb, var(--warn) 10%, transparent); padding:8px 12px; border-radius:6px; font-size:14px}
.badge{display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.b-good{color:var(--good); border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.b-mixed{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.b-bad{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.toast{font-size:13px; color:var(--good); min-height:1.2em}
.pod{display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:10px}
@media (max-width:640px){.pod{grid-template-columns:1fr}}
.tube{border:1px solid var(--line); border-radius:10px; background:var(--raised); padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0}
.tube h4{margin:0; font:600 12px var(--display); letter-spacing:.6px; text-transform:uppercase; color:var(--muted)}
.tube.center{border-style:dashed}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 8px; font-size:13px; line-height:1.4; overflow-wrap:anywhere}
.chip b{font-weight:600}
.chip .t{display:block; color:var(--muted); font-size:12px}
.chip.empty{color:var(--muted); font-style:italic}
.chip.anim{border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.res{display:flex; flex-direction:column; gap:12px}
.bars{display:flex; flex-direction:column; gap:5px}
.bar{display:grid; grid-template-columns:minmax(110px,210px) 1fr 52px; gap:8px; align-items:center; font-size:13px}
.bar>span:first-child{overflow-wrap:anywhere}
.bar .track{height:10px; background:var(--line); border-radius:6px; overflow:hidden}
.bar .fill{height:100%; background:var(--accent); border-radius:6px}
.bar .fill.none{background:var(--muted)}
.bar .fill.lock{background:var(--warn)}
.bar .pct{text-align:right; font-variant-numeric:tabular-nums}
.slotname{font:600 13px var(--display); margin:6px 0 2px}
.simpod{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:1000px){.simpod{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.simpod{grid-template-columns:1fr}}
.slot{border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--surface); display:flex; flex-direction:column; gap:8px; min-width:0}
.slot.parent{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.slot h4{margin:0; font:600 13px var(--display)}
.steps{display:flex; flex-direction:column; gap:14px; counter-reset:st}
.step{border:1px solid var(--line); border-radius:10px; background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:10px}
.step h3{font-size:17px; display:flex; gap:10px; align-items:baseline}
.step h3::before{counter-increment:st; content:counter(st); font:700 14px var(--display); color:var(--accent-ink); background:var(--accent); border-radius:6px; padding:1px 8px}
.step .why{margin:0; color:var(--muted); font-size:14px}
.kpis{display:flex; flex-wrap:wrap; gap:6px}
.kpi{font-size:13px; padding:3px 10px; border-radius:99px; background:var(--raised); border:1px solid var(--line); font-variant-numeric:tabular-nums}
.kpi b{color:var(--accent)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font:600 13px var(--display); color:var(--muted); position:sticky; top:0; background:var(--surface)}
.modal{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:10}
.modal.on{display:flex}
.modal .card{max-width:640px; width:100%; display:flex; flex-direction:column; gap:10px}
.sources{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px; font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Fusion Pod <span>Planner</span></h1>
      <p data-i18n="lead"></p>
    </div>
    <div class="hdr-tools">
      <div class="seg" id="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="th" aria-pressed="false">ไทย</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <div class="toolbar">
        <button class="btn sm" type="button" id="btn-save" data-i18n="save"></button>
        <label class="btn ghost sm" for="file-in"><span data-i18n="open"></span><input type="file" id="file-in" accept=".json,application/json" class="visually-hidden"></label>
        <button class="btn ghost sm" type="button" id="btn-paste" data-i18n="paste"></button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-plan" aria-selected="true" data-p="plan" data-i18n="tab_plan"></button>
    <button class="tab" role="tab" id="t-sim" aria-selected="false" data-p="sim" data-i18n="tab_sim"></button>
    <button class="tab" role="tab" id="t-ref" aria-selected="false" data-p="ref" data-i18n="tab_ref"></button>
    <button class="tab" role="tab" id="t-cfg" aria-selected="false" data-p="cfg" data-i18n="tab_cfg"></button>
  </nav>

  <section class="panel on" id="p-plan" role="tabpanel">
    <div class="grid2">
      <div class="card form">
        <h2 style="font-size:18px" data-i18n="goal"></h2>
        <button class="btn ghost sm" id="pl-preset" type="button" style="align-self:flex-start" data-i18n="preset"></button>
        <label for="pl-species"><span data-i18n="f_species_t"></span><select id="pl-species"></select></label>
        <label for="pl-variant"><span data-i18n="f_variant"></span><select id="pl-variant"></select></label>
        <label for="pl-event"><span data-i18n="f_event"></span>
          <select id="pl-event">
            <option value="" data-i18n="none"></option>
            <option value="Starfall" data-i18n="ev_starfall"></option>
            <option value="Lunar" data-i18n="ev_lunar"></option>
            <option value="Aberrant" data-i18n="ev_aberrant"></option>
          </select>
        </label>
        <label for="pl-general"><span data-i18n="f_general"></span><select id="pl-general"></select></label>
        <label for="pl-role"><span id="pl-role-label"></span><select id="pl-role"></select></label>
        <label for="pl-mut"><span data-i18n="f_mut"></span><select id="pl-mut"></select></label>
        <label for="pl-stat"><span data-i18n="f_stat"></span><select id="pl-stat"></select></label>
        <div>
          <div class="note" style="margin-bottom:4px" data-i18n="f_server"></div>
          <div class="seg" id="pl-server">
            <button type="button" data-v="normal" aria-pressed="true" data-i18n="srv_normal"></button>
            <button type="button" data-v="scp" aria-pressed="false">SCP</button>
          </div>
        </div>
        <label for="pl-carrier"><span data-i18n="f_carrier"></span><select id="pl-carrier"></select></label>
        <p class="note" style="margin:0" data-i18n="carrier_note"></p>
      </div>
      <div class="res">
        <div class="card" id="pl-summary"></div>
        <div class="steps" id="pl-steps"></div>
      </div>
    </div>
  </section>

  <section class="panel" id="p-sim" role="tabpanel">
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div style="flex:2 1 300px"><h2 style="font-size:18px" data-i18n="sim_h"></h2><p class="note" style="margin:2px 0 0" data-i18n="sim_note"></p></div>
        <div class="row" style="flex:1 1 260px; justify-content:flex-end">
          <button class="btn ghost sm" id="sim-clear" type="button" data-i18n="clear"></button>
          <button class="btn ghost sm" id="sim-example" type="button" data-i18n="example"></button>
        </div>
      </div>
    </div>
    <div class="simpod" id="sim-slots"></div>
    <div class="card res" id="sim-result"></div>
  </section>

  <section class="panel" id="p-ref" role="tabpanel">
    <div class="card form">
      <div class="row">
        <label for="ref-q" style="flex:2 1 240px"><span data-i18n="q"></span><input type="text" id="ref-q" data-i18n-ph="q_ph"></label>
        <label for="ref-slot"><span data-i18n="slot"></span>
          <select id="ref-slot">
            <option value="" data-i18n="all_slots"></option>
            <option value="general" data-i18n="sl_general"></option>
            <option value="role" data-i18n="sl_role"></option>
            <option value="mutation" data-i18n="sl_mutation"></option>
            <option value="stat" data-i18n="sl_stat"></option>
            <option value="variant" data-i18n="variant_only"></option>
          </select>
        </label>
        <label for="ref-kind"><span data-i18n="kind"></span>
          <select id="ref-kind">
            <option value="" data-i18n="all"></option>
            <option value="good" data-i18n="kind_good"></option>
            <option value="mixed" data-i18n="kind_mixed"></option>
            <option value="bad" data-i18n="kind_bad"></option>
          </select>
        </label>
      </div>
      <div class="tablewrap"><table id="ref-table"></table></div>
    </div>
  </section>

  <section class="panel" id="p-cfg" role="tabpanel">
    <div class="grid2">
      <div class="card form">
        <h2 style="font-size:18px" data-i18n="cfg_h"></h2>
        <div class="row">
          <label for="cfg-base"><span data-i18n="c_base"></span><input type="number" id="cfg-base" min="0" max="100"></label>
          <label for="cfg-step"><span data-i18n="c_step"></span><input type="number" id="cfg-step" min="0" max="50"></label>
          <label for="cfg-cap"><span data-i18n="c_cap"></span><input type="number" id="cfg-cap" min="0" max="100"></label>
        </div>
        <div class="row">
          <label for="cfg-up"><span data-i18n="c_up"></span><input type="number" id="cfg-up" min="0" max="100" step="0.1"></label>
          <label for="cfg-down"><span data-i18n="c_down"></span><input type="number" id="cfg-down" min="0" max="100" step="0.1"></label>
        </div>
        <label for="cfg-vslot"><span data-i18n="c_vslot"></span>
          <select id="cfg-vslot"><option value="role" data-i18n="c_vslot_role"></option><option value="general" data-i18n="c_vslot_gen"></option></select>
        </label>
        <button class="btn ghost sm" id="cfg-reset" type="button" style="align-self:flex-start" data-i18n="reset"></button>
      </div>
      <div class="card form">
        <h2 style="font-size:18px" data-i18n="rules_h"></h2>
        <ol style="margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px">
          <li data-i18n-html="r1"></li><li data-i18n-html="r2"></li><li data-i18n-html="r3"></li><li data-i18n-html="r4"></li>
          <li data-i18n-html="r5"></li><li data-i18n-html="r6"></li><li data-i18n-html="r7"></li>
        </ol>
        <p class="note" style="margin:0" data-i18n="disclaimer"></p>
        <h3 style="font-size:15px" data-i18n="src_h"></h3>
        <ul class="sources">
          <li><a href="https://www.youtube.com/watch?v=lyNM0s2CUIY" target="_blank" rel="noopener">THE ULTIMATE 100% TRAIT FUSION GUIDE! PERFECT 5/5 | Once Human — GTJanne (YouTube)</a></li>
          <li><a href="https://note.com/elias04201/n/n07ff10ec45cc?hl=en" target="_blank" rel="noopener">[Once Human] Deviations and Fusion: An Overview — 足長よしお (note.com)</a></li>
          <li><a href="https://fusiontracker.io/" target="_blank" rel="noopener">Once Human Fusion Tracker</a></li>
          <li><a href="https://gamingwithdaopa.ellatha.com/once-human/deviant-traits/" target="_blank" rel="noopener">Once Human Deviant Traits — Gaming with Daopa</a></li>
          <li><a href="https://once-human.fandom.com/wiki/Traits" target="_blank" rel="noopener">Traits — Once Human Wiki (Fandom)</a></li>
        </ul>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h">
  <div class="card">
    <h2 style="font-size:18px" id="modal-h"></h2>
    <p class="note" style="margin:0" id="modal-note"></p>
    <label for="modal-text" class="visually-hidden">Plan code</label>
    <textarea id="modal-text" spellcheck="false"></textarea>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost sm" type="button" id="modal-copy" data-i18n="copy" style="flex:0 0 auto"></button>
      <button class="btn sm" type="button" id="modal-load" data-i18n="load_btn" style="flex:0 0 auto"></button>
      <button class="btn ghost sm" type="button" id="modal-close" data-i18n="close" style="flex:0 0 auto"></button>
    </div>
  </div>
</div>

<script>
/* ================= I18N ================= */
const LANGS=["en","th","zh"];
let LANG="en"; try{const s=localStorage.getItem("fp-lang"); if(LANGS.includes(s)) LANG=s;}catch(e){}
const LI=()=>LANGS.indexOf(LANG);
const tx=a=>Array.isArray(a)?(a[LI()]||a[0]):a;
const S={
 lead:["Pick a Deviation, variant and traits. The planner lays out each fusion step and calculates its odds: lock traits at 100% first, chase a 5/5 rating last.","เลือก Deviation, Variant และ Trait ที่ต้องการ แล้วหน้านี้จะวางลำดับการผสมพร้อมคำนวณโอกาสในแต่ละขั้น โดยล็อก trait ให้ได้ 100% ก่อนแล้วค่อยไล่ค่า 5/5","选择想要的异常物、变体和特性，本页会列出每一步融合并计算成功率：先把特性锁定到100%，最后再追求5/5评级。"],
 save:["Save plan to file","บันทึกแผนเป็นไฟล์","保存规划为文件"],
 open:["Open plan file","เปิดไฟล์แผน","打开规划文件"],
 paste:["Paste plan code","วางโค้ดแผน","粘贴规划代码"],
 copy:["Copy","คัดลอก","复制"],
 load_btn:["Load plan","เปิดแผน","载入规划"],
 close:["Close","ปิด","关闭"],
 saved:["Saved {f}","บันทึก {f} แล้ว","已保存 {f}"],
 copied:["Plan code copied","คัดลอกโค้ดแผนแล้ว","已复制规划代码"],
 loaded:["Plan loaded","เปิดแผนแล้ว","已载入规划"],
 load_err:["That isn't a Fusion Pod Planner plan. Check that you picked the right file or pasted the whole code.","ไฟล์หรือโค้ดนี้ไม่ใช่แผนของ Fusion Pod Planner ตรวจว่าเลือกไฟล์ถูก หรือวางโค้ดครบทั้งหมด","这不是 Fusion Pod Planner 规划。请确认选对了文件或粘贴了完整代码。"],
 m_save_h:["Plan code","โค้ดแผน","规划代码"],
 m_save_note:["This viewer blocked the file download. Copy this code into a text file ending in .json, or send it to a friend: they can open it with “Paste plan code”.","ตัวเปิดหน้านี้บล็อกการดาวน์โหลดไฟล์ คัดลอกโค้ดนี้ไปวางในไฟล์ที่ลงท้ายด้วย .json หรือส่งให้เพื่อน แล้วเพื่อนเปิดด้วยปุ่ม “วางโค้ดแผน”","当前查看器阻止了文件下载。请把这段代码复制到以 .json 结尾的文本文件，或直接发给朋友，对方用“粘贴规划代码”打开。"],
 m_paste_h:["Paste plan code","วางโค้ดแผน","粘贴规划代码"],
 m_paste_note:["Paste the code from a saved plan file, then select Load plan.","วางโค้ดจากไฟล์แผนที่บันทึกไว้ แล้วกด เปิดแผน","粘贴已保存规划文件中的代码，然后点击“载入规划”。"],
 tab_plan:["Fusion plan","วางแผนการผสม","融合规划"],
 tab_sim:["Fusion Pod simulator","เครื่องจำลอง Fusion Pod","Fusion Pod 模拟器"],
 tab_ref:["Trait list","รายการ Trait","特性列表"],
 tab_cfg:["Settings & rules","ตั้งค่าและกฎ","设置与规则"],
 goal:["Target","เป้าหมาย","目标"],
 preset:["Example: Butterfly Starry Night with 4 traits","ตั้งตามตัวอย่าง: Butterfly Starry Night 4 trait","示例：Butterfly Starry Night 4个特性"],

 w_mut:["No known animal or furniture gives {t}. Try materials one at a time in the in-game preview. Steps that need this trait assume you already have one Deviation carrying it.","ยังไม่รู้ว่าสัตว์หรือเฟอร์นิเจอร์ชิ้นไหนให้ {t} ให้ลองใส่วัสดุทีละชิ้นในหน้า preview ของเกม ขั้นที่ใช้ trait นี้จะถือว่าคุณมี Deviation ที่มี trait นี้อยู่แล้ว 1 ตัว","尚不清楚哪种动物或家具提供 {t}。请在游戏预览中逐个尝试材料。需要该特性的步骤假定你已有1只带此特性的异常物。"],
 w_star:["Starfall Mutagen fusion only works on SCP servers during the event. On standard servers you need to buy or trade for one.","Starfall Mutagen ผสมได้เฉพาะเซิร์ฟ SCP ช่วงอีเวนต์ ในเซิร์ฟปกติต้องซื้อหรือแลกจากตลาด","Starfall 突变剂融合仅在活动期间的SCP服务器可用；普通服务器需要购买或交易。"],
 s_mat_t:["Put {t} on {c}","ใส่ {t} ลงตัว {c}","把 {t} 放到 {c} 上"],
 s_mat_w:["Put 2× {m} in the middle. The trait then has 2 sources and no competitor, so it lands 100%. Run it twice to get 2 copies.","ใส่ {m} 2 ชิ้นตรงกลาง trait นี้จะมี 2 แหล่งและไม่มีคู่แข่ง จึงติด 100% ทำ 2 รอบเพื่อให้ได้ 2 ตัว (ไว้ใช้เป็นสำเนา)","在中间放入2个{m}。该特性有2个来源且无竞争，因此100%继承。做两次，得到2个（作为副本）。"],
 s_src_t:["Move {t} onto {c}","ย้าย {t} มาไว้บน {c}","把 {t} 转移到 {c}"],
 s_src_role:["Farm a {cat} Deviation that carries {t} (type traits can't cross types)","ฟาร์ม Deviation สาย {cat} ที่ติด {t} (trait ประจำสายข้ามสายไม่ได้)","刷一只带 {t} 的{cat}异常物（类型专属特性不能跨类型）"],
 s_src_stat:["Find a Deviation on an SCP server that carries {t}","หา Deviation ในเซิร์ฟ SCP ที่ติด {t}","在SCP服务器找一只带 {t} 的异常物"],
 s_src_gen:["Find any Deviation that carries {t}","หา Deviation ตัวใดก็ได้ที่ติด {t}","找任意一只带 {t} 的异常物"],
 s_src_w:["{src}, then fuse it with a clean {c}. Put 3 clean {c} in the middle to push species and trait odds to the cap. Repeat until you have 2.","{src} แล้วผสมกับ {c} สะอาด ใส่ {c} สะอาด 3 ตัวตรงกลางเพื่อดันสายพันธุ์และ trait ขึ้นเพดาน ทำซ้ำจนได้ 2 ตัว","{src}，然后与干净的 {c} 融合。中间放3只干净的 {c}，把物种和特性概率推到上限。重复直到得到2只。"],
 s_merge_t:["Combine all traits on one {c}","รวม trait ทั้งหมดไว้บน {c} ตัวเดียว","把所有特性集中到一只 {c} 上"],
 s_merge_w:["Use 2 of each trait group (left/right tube plus a copy in the middle). Every trait then has 2 sources and lands 100%. Only use clean copies: an old trait in the same slot lowers the odds.","ใส่ตัวที่มี trait กลุ่มละ 2 ตัว (หลอดซ้าย/ขวา + สำเนาตรงกลาง) ทุก trait จะมี 2 แหล่งจึงติด 100% ถ้ามี trait เดิมแข่งในช่องเดียวกันโอกาสจะลดลง ให้ใช้ตัวที่สะอาดเท่านั้น","每组特性各用2只（左/右管+中间副本），每个特性都有2个来源，因此100%继承。只用干净个体：同一栏位的旧特性会降低概率。"],
 s_dup_t:["Clone the trait bundle ({c}) as spares","โคลนตัวรวม trait ({c}) ให้มีสำรอง","复制特性合集（{c}）作为备用"],
 s_dup_w:["Bundle in the left tube, clean {c} in the right tube and the middle. Each trait has one source, so it only reaches about the cap; getting all of them is the product. Repeat until you have 2–3.","หลอดซ้ายตัวรวม trait หลอดขวาและตรงกลางเป็น {c} สะอาด แต่ละ trait มีแหล่งเดียวจึงติดได้แค่ราวเพดาน โอกาสได้ครบทุกตัวคือผลคูณ ทำซ้ำจนมีอย่างน้อย 2–3 ตัว","左管放特性合集，右管和中间放干净的 {c}。每个特性只有1个来源，只能接近上限；全部继承的概率是各项相乘。重复直到有2–3只。"],
 s_xfer_t:["Move the whole set into {T}","ย้าย trait ทั้งชุดเข้า {T}","把整套特性转移到 {T}"],
 s_xfer_w:["Clean {T} in the left tube, the bundle in the right tube. In the middle: 1 bundle copy so every trait has 2 sources, and 2 more {T} to raise the species odds.{v}","{T} สะอาดในหลอดซ้าย ตัวรวม trait ในหลอดขวา ตรงกลางใส่สำเนาตัวรวม trait 1 ตัวเพื่อให้ทุก trait มี 2 แหล่ง และ {T} อีก 2 ตัวเพื่อดันโอกาสสายพันธุ์{v}","左管放干净的 {T}，右管放特性合集。中间放1个合集副本，使每个特性有2个来源，再放2只 {T} 提高物种概率。{v}"],
 s_xfer_v:[" Use the {T} form for all of them so the variant has 3 sources."," ใช้ร่าง {T} ทั้งหมดเพื่อให้ Variant มี 3 แหล่ง","全部使用 {T} 形态，使变体有3个来源。"],
 s_var_t:["Get 2+ clean {T}","หา {T} สะอาด 2 ตัวขึ้นไป","准备2只以上干净的 {T}"],
 s_var_w:["A unique variant only comes from a Deviation already in that form. Put that form in both tubes: the variant has 2 sources and lands 100%.","Variant เฉพาะตัวต้องมาจากตัวที่เป็นร่างนั้นอยู่แล้ว ใส่ร่างนั้นทั้งสองหลอด Variant จะมี 2 แหล่งและติด 100%","专属变体只能来自已经是该形态的个体。两个管都放该形态，变体有2个来源，100%继承。"],
 s_x5_t:["Raise Activity to x/5","ไล่ค่า Activity เป็น x/5","把活跃评级提升到 x/5"],
 s_x5_w:["Fully-traited target in the left tube, a clean {T} with Activity 5 in the right tube, and a fully-traited copy in the middle to lock traits at 100%. Repeat if Activity doesn't reach 5.","ตัวเป้าหมายที่ติด trait ครบในหลอดซ้าย {T} สะอาดที่ Activity 5 ในหลอดขวา ตรงกลางใส่สำเนาที่ติด trait ครบเพื่อล็อก trait 100% ถ้า Activity ไม่ขึ้น 5 ให้ทำซ้ำ","左管放全特性目标，右管放活跃5的干净 {T}，中间放全特性副本把特性锁定在100%。活跃没到5就重复。"],
 s_55_t:["Raise to 5/5","ไล่ค่าเป็น 5/5","提升到 5/5"],
 s_55_w:["Fully-traited x/5 in the left tube, a clean 5/5 {T} in the right tube, a fully-traited copy in the middle. Lock traits at 100% first, then chase 5/5.","ตัวที่ติด trait ครบและเป็น x/5 ในหลอดซ้าย {T} 5/5 สะอาดในหลอดขวา ตรงกลางเป็นสำเนาที่ติด trait ครบ ล็อก trait ให้ได้ 100% ก่อน แล้วค่อยไล่ค่า 5/5","左管放全特性的 x/5，右管放干净的 5/5 {T}，中间放全特性副本。先把特性锁定到100%，再追求5/5。"],
 s_ev_t:["Final fusion into {e} {T}","ผสมขั้นสุดท้ายเป็น {e} {T}","最终融合为 {e} {T}"],
 s_ev_w:["Only use 5/5 + 5/5. Put a fully-traited copy in the middle to lock traits at 100%, and add {m}. Careful: even with traits locked, Skill can still drop to 4 or 3, and the parents lose their fusion chance immediately.","ใช้ 5/5 + 5/5 เท่านั้น ตรงกลางใส่ตัวที่ติด trait ครบเพื่อล็อก 100% และใส่ {m} ระวัง: ถึง trait จะล็อกแล้ว ค่า Skill ยังตกเป็น 4 หรือ 3 ได้ และพ่อแม่จะหมดสิทธิ์ผสมทันที","只用 5/5 + 5/5。中间放全特性副本锁定100%，并放入{m}。注意：即使特性已锁定，技能评级仍可能降到4或3，且父母会立即失去融合次数。"],

 r1:["<b>Offspring species:</b> only a parent's species. Odds = Deviations of that species (parents + materials) ÷ all Deviations of the parents' species. Materials of other species, animals and furniture don't count.","<b>สายพันธุ์ลูก:</b> ได้เฉพาะสายพันธุ์ของพ่อหรือแม่ โอกาส = จำนวนตัวสายพันธุ์นั้น (พ่อแม่ + วัสดุ) ÷ จำนวนตัวที่เป็นสายพันธุ์ของพ่อแม่ทั้งหมด วัสดุสายพันธุ์อื่น สัตว์ และเฟอร์นิเจอร์ไม่นับ","<b>子代物种：</b>只能是父母之一的物种。概率 = 该物种数量（父母+材料）÷ 父母物种的总数量。其他物种的材料、动物和家具不计入。"],
 r2:["<b>4 trait slots:</b> General, Type, Deviated, Stat (SCP). The offspring gets at most 1 per slot.","<b>ช่อง trait 4 ช่อง:</b> ทั่วไป, ประจำสาย, Deviated, Stat (SCP) ลูกได้ช่องละไม่เกิน 1","<b>4个特性栏位：</b>通用、类型专属、变异、属性（SCP）。子代每个栏位最多1个。"],
 r3:["<b>Unique variants</b> (e.g. Butterfly's Starry Night, the Eel's Golden form) use the slot chosen on the left, the Type slot by default. If the offspring isn't that species, the slot ends up empty, which is how junk traits get cleaned.","<b>Variant เฉพาะตัว</b> (เช่น Starry Night ของ Butterfly, Golden ของ Eel) ใช้ช่องที่เลือกไว้ด้านซ้าย ค่าเริ่มต้นคือช่องประจำสาย ถ้าลูกไม่ใช่สายพันธุ์นั้น ช่องนั้นจะว่าง จึงใช้ “ล้าง” trait ขยะได้","<b>专属变体</b>（如 Butterfly 的 Starry Night、Eel 的 Golden）占用左侧选择的栏位，默认为类型专属栏位。若子代不是该物种，该栏位为空，可借此清除垃圾特性。"],
 r4:["<b>Type traits</b> never cross types: Combat traits can't land on Territory or Crafting.","<b>Trait ประจำสาย</b> ข้ามสายไม่ได้ Combat ไม่ไปลง Territory/Crafting","<b>类型专属特性</b>不能跨类型：战斗特性不会出现在领地或制造异常物上。"],
 r5:["<b>Competing traits:</b> odds = sources of that trait ÷ all sources in the slot.","<b>หลาย trait แย่งช่อง:</b> โอกาส = จำนวนแหล่งของ trait นั้น ÷ จำนวนแหล่งทั้งหมดในช่อง","<b>特性竞争：</b>概率 = 该特性来源数 ÷ 该栏位全部来源数。"],
 r6:["<b>One trait in a slot:</b> 2+ sources = 100%. One source = base + bonus per Deviation with no trait in that slot, up to the cap.","<b>trait เดียวในช่อง:</b> มี 2 แหล่งขึ้นไป = 100% มีแหล่งเดียว = พื้นฐาน + ค่าเพิ่มต่อ Deviation ที่ไม่มี trait ในช่องนั้น (ไม่เกินเพดาน)","<b>栏位只有一个特性：</b>2个以上来源 = 100%。1个来源 = 基础值 + 每只该栏位无特性异常物的加成，不超过上限。"],
 r7:["<b>Skill/Activity:</b> each comes from either parent (50/50), then may go +1 or −1 at the rates set here.","<b>ค่า Skill/Activity:</b> แต่ละค่าสุ่มจากพ่อหรือแม่ฝั่งละ 50% แล้วมีโอกาส +1/−1 ตามที่ตั้งไว้","<b>技能/活跃评级：</b>各自从父母之一继承（各50%），再按此处设定的概率 +1 或 −1。"],
 disclaimer:["These numbers aren't confirmed by the developer. Always compare against the in-game preview before fusing.","ตัวเลขยังไม่ยืนยันจากผู้พัฒนา ให้เทียบกับหน้า preview ในเกมก่อนกดผสมทุกครั้ง","这些数值未经开发者确认。融合前请务必与游戏内预览核对。"],

function dev(species,traits={},sk=3,ac=3,label=""){return {kind:"dev",species,traits:{general:"",role:"",mutation:"",stat:"",...traits},sk,ac,label,cat:SP[species]?SP[species].cat:"combat"};}
function mat(kind,name){return {kind,name};}
const catOfSpecies=(s,items)=>{ if(SP[s]) return SP[s].cat; const it=(items||[]).find(x=>x.kind==="dev"&&x.species===s); return it?it.cat:"combat"; };
function compute(setup){
  const parents=[setup.L,setup.R].filter(x=>x&&x.kind==="dev"&&x.species);
  const items=[setup.L,setup.R,...setup.M].filter(x=>x&&x.kind!=="empty"&&(x.kind!=="dev"||x.species));
  const devs=items.filter(x=>x.kind==="dev");
  const pSp=[...new Set(parents.map(p=>p.species))];
  const cnt={}; pSp.forEach(s=>cnt[s]=0); devs.forEach(d=>{if(d.species in cnt) cnt[d.species]++;});
  const tot=Object.values(cnt).reduce((a,b)=>a+b,0);
  const species=pSp.map(s=>({s,p:tot?cnt[s]/tot*100:0})).sort((a,b)=>b.p-a.p);
  const per={}; species.forEach(({s})=>per[s]=slotsFor(s,items));
  const rating=parents.length===2?ratings(parents[0],parents[1]):null;
  return {species,per,rating,valid:parents.length===2};
}
function slotsFor(s,items){
  const cat=catOfSpecies(s,items); const out={};
  for(const slot of SLOTS){
    const counts={}; let clean=0;
    for(const it of items){
      let tr="";
      if(it.kind==="dev"){
        if(slot==="role"){ if(it.cat!==cat) continue; tr=it.traits.role; if(tr&&TR[tr]&&TR[tr].cat&&TR[tr].cat!==cat) tr=""; }
        else tr=it.traits[slot];
        if(!tr){clean++; continue;}
      } else if(slot==="mutation"){ tr=matT(it.kind,it.name); if(!tr) continue; }
      else continue;
      counts[tr]=(counts[tr]||0)+1;
    }
    const keys=Object.keys(counts); let dist;
    if(keys.length===0) dist=[{t:"",p:100}];
    else if(keys.length===1){ const k=keys[0]; const p=counts[k]>=2?100:Math.min(CFG.cap,CFG.base+CFG.step*clean); dist=[{t:k,p,n:counts[k]}]; if(p<100) dist.push({t:"",p:100-p}); }
    else { const T=keys.reduce((a,k)=>a+counts[k],0); dist=keys.map(k=>({t:k,p:counts[k]/T*100,n:counts[k]})).sort((a,b)=>b.p-a.p); }
    dist=dist.map(d=>(d.t&&VARIANT_OWNER[d.t]&&!VARIANT_OWNER[d.t].includes(s))?{...d,lock:true}:d);
    out[slot]=dist;
  }
  return out;
}
function statDist(a,b){
  const base={}; base[a]=(base[a]||0)+.5; base[b]=(base[b]||0)+.5;
  const out={}; const up=CFG.up/100, dn=CFG.down/100;
  for(const [v,p] of Object.entries(base)){ const x=+v;
    const add=(k,q)=>{k=Math.max(1,Math.min(5,k)); out[k]=(out[k]||0)+q;};
    add(x+1,p*up); add(x-1,p*dn); add(x,p*(1-up-dn)); }
  return out;
}
function ratings(A,B){ const sk=statDist(A.sk,B.sk), ac=statDist(A.ac,B.ac); return {sk,ac,p55:(sk[5]||0)*(ac[5]||0)*100}; }
function pWant(res,want){
  const sp=res.species.find(x=>x.s===want.species); if(!sp) return 0;
  let p=sp.p/100; const slots=res.per[want.species];
  for(const slot of SLOTS){ const w=want.traits[slot]; if(!w) continue;
    const d=slots[slot].find(x=>x.t===w&&!x.lock); p*= d? d.p/100 : 0; }
  return p*100;
}
const pct=v=>(v>=99.95?"100":v<0.05?"0":v.toFixed(v<10?1:0))+"%";

  return h;
}

function buildPlan(w){
  const T=w.species, cat=SP[T].cat, C=w.carrier, VS=CFG.vslot;
  const steps=[], warns=[];
  const clash=w.variant&&(VS==="general"?w.general:w.role);
  if(clash) warns.push(t("w_clash",{v:w.variant,slot:SLOT_T(VS),x:clash}));
  if(w.mut&&!MAT_FOR_TRAIT[w.mut]) warns.push(t("w_mut",{t:w.mut}));
  if(w.event==="Starfall"&&SERVER!=="scp") warns.push(t("w_star"));
  const bundle={general:(w.variant&&VS==="general")?"":w.general,role:(w.variant&&VS==="role")?"":w.role,mutation:w.mut,stat:w.stat};
  const bTraits=Object.entries(bundle).filter(([,v])=>v);
  const tGen=w.variant?{[VS]:w.variant}:{};

  const tClean=(sk=3,ac=3,l)=>dev(T,{...tGen},sk,ac,l||t("lbl_clean",{x:tLabel}));
  const add=(title,why,setup,want,extra)=>{const res=compute(setup); steps.push({title,why,setup,res,want,p:want?pWant(res,want):null,extra});};
  for(const [slot,tr] of bTraits){
    const want={species:C,traits:{[slot]:tr}};
    if(slot==="mutation"&&MAT_FOR_TRAIT[tr]){
      const m=MAT_FOR_TRAIT[tr];
      add(t("s_mat_t",{t:tr,c:C}),t("s_mat_w",{m:matL(m.kind,m.name)}),{L:cClean(),R:cClean(),M:[mat(m.kind,m.name),mat(m.kind,m.name),{kind:"empty"}]},want);

      add(t("s_src_t",{t:tr,c:C}),t("s_src_w",{src:srcTxt,c:C}),{L:dev(src,{[slot]:tr},3,3,t("lbl_with",{x:src,t:tr})),R:cClean(),M:[cClean(),cClean(),cClean()]},want);
    }
  }
  if(bTraits.length>=2){
    const half=Math.ceil(bTraits.length/2), first=bTraits.slice(0,half), second=bTraits.slice(half);
    const A=Object.fromEntries(first), B=Object.fromEntries(second);
    const dA=()=>dev(C,A,3,3,C+" + "+first.map(x=>x[1]).join(", ")), dB=()=>dev(C,B,3,3,C+" + "+second.map(x=>x[1]).join(", "));
    add(t("s_merge_t",{c:C}),t("s_merge_w"),{L:dA(),R:dB(),M:[dA(),dB(),cClean()]},{species:C,traits:bundle});
  }
  const bundleDev=(sp,l)=>dev(sp,{...bundle,...(sp===T?tGen:{})},3,3,l);
  if(bTraits.length) add(t("s_dup_t",{c:C}),t("s_dup_w",{c:C}),{L:bundleDev(C,t("lbl_bundle",{x:C})),R:cClean(),M:[cClean(),cClean(),cClean()]},{species:C,traits:bundle});
  if(C!==T&&bTraits.length){
    add(t("s_xfer_t",{T:tLabel}),t("s_xfer_w",{T,v:w.variant?t("s_xfer_v",{T:tLabel}):""}),
      {L:tClean(),R:bundleDev(C,t("lbl_bundle",{x:C})),M:[bundleDev(C,t("lbl_bundle",{x:C})+t("lbl_copy")),tClean(),tClean()]},{species:T,traits:{...bundle,...tGen}});
  }
  if(!bTraits.length&&w.variant) add(t("s_var_t",{T:tLabel}),t("s_var_w"),{L:tClean(),R:tClean(),M:[{kind:"empty"},{kind:"empty"},{kind:"empty"}]},{species:T,traits:tGen});
  const tFull=(sk,ac,l)=>dev(T,{...bundle,...tGen},sk,ac,l);
  const wantT={species:T,traits:{...bundle,...tGen}};
  const full=t("lbl_full",{x:tLabel});
  add(t("s_x5_t"),t("s_x5_w",{T}),{L:tFull(3,3,full),R:tClean(3,5,t("lbl_clean",{x:T})+" x/5"),M:[tFull(3,3,full+t("lbl_copy")),tClean(),{kind:"empty"}]},wantT,"rating");
  add(t("s_55_t"),t("s_55_w",{T}),{L:tFull(3,5,full+" x/5"),R:tClean(5,5,t("lbl_clean",{x:T})+" 5/5"),M:[tFull(3,3,full+t("lbl_copy")),{kind:"empty"},{kind:"empty"}]},wantT,"rating");
  if(w.event) add(t("s_ev_t",{e:w.event,T}),t("s_ev_w",{m:w.event==="Starfall"?t("m_star"):t("m_other",{e:w.event})}),
    {L:tFull(5,5,full+" 5/5"),R:tFull(5,5,tLabel+" 5/5"),M:[tFull(3,3,full+t("lbl_copy")),{kind:"empty"},{kind:"empty"}]},wantT,"rating");
  return {steps,warns};
}
let LAST_PLAN=null;
function renderPlan(){
  const w=readWant(); const plan=buildPlan(w); LAST_PLAN={w,plan}; const {steps,warns}=plan; const VS=CFG.vslot;
  const listT=[w.variant?("Variant "+w.variant):"",(w.variant&&VS==="general")?"":w.general,(w.variant&&VS==="role")?"":w.role,w.mut,w.stat].filter(Boolean);
  $("pl-summary").innerHTML=`<h2 style="font-size:18px">${esc(w.species)} ${w.event?esc(w.event):""} 5/5</h2>
   <p style="margin:6px 0 10px">${t("target_traits")} ${listT.length?listT.map(x=>`<span class="badge b-good">${esc(x)}</span>`).join(" "):t("not_set")}</p>
   <div class="kpis"><span class="kpi">${t("k_steps")}: <b>${steps.length}</b></span><span class="kpi">${t("k_carrier")}: <b>${esc(w.carrier)}</b></span><span class="kpi">${t("k_server")}: <b>${SERVER==="scp"?"SCP":t("srv_norm_s")}</b></span></div>
   ${warns.map(x=>`<div class="warn" style="margin-top:10px">${esc(x)}</div>`).join("")}
   <p class="note" style="margin:10px 0 0">${t("sum_note")}</p>`;
  $("pl-steps").innerHTML=steps.map((st,i)=>{
    const sp=(st.res.species.find(x=>x.s===st.want.species)||{p:0}).p;
    const kp=[`<span class="kpi">${esc(t("k_get",{s:st.want.species}))} <b>${pct(sp)}</b></span>`,
      st.p!=null?`<span class="kpi">${t("k_all")} <b>${pct(st.p)}</b></span>`:"",
      st.extra==="rating"&&st.res.rating?`<span class="kpi">${t("k_55")} <b>${pct(st.res.rating.p55)}</b></span>`:"",
      st.p?`<span class="kpi">${t("k_tries",{n:Math.max(1,Math.round(100/st.p))})}</span>`:""].join("");
    return `<article class="step"><h3>${esc(st.title)}</h3><p class="why">${esc(st.why)}</p>${podHTML(st.setup)}<div class="kpis">${kp}</div>
      <div><button class="btn ghost sm" type="button" data-load="${i}">${t("open_sim")}</button></div></article>`;
  }).join("");
  $("pl-steps").querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{ loadSim(steps[+b.dataset.load].setup); showTab("sim"); });
}

/* ================= SIMULATOR ================= */
let SIM={L:null,R:null,M:[null,null,null]}, FOCUS="";
const SLOT_KEYS=["L","M0","M1","M2","R"];
const getSlot=k=>k==="L"?SIM.L:k==="R"?SIM.R:SIM.M[+k[1]];
const setSlot=(k,v)=>{ if(k==="L")SIM.L=v; else if(k==="R")SIM.R=v; else SIM.M[+k[1]]=v; };
const clone=x=>x?JSON.parse(JSON.stringify(x)):null;
function loadSim(setup){ SIM={L:clone(setup.L),R:clone(setup.R),M:[0,1,2].map(i=>setup.M[i]&&setup.M[i].kind!=="empty"?clone(setup.M[i]):null)}; FOCUS=""; renderSimSlots(); renderSim(); }
const DL_ID={general:"dl-general",role:"dl-role",mutation:"dl-mut",stat:"dl-stat"};
function datalists(){
  const mk=(id,arr)=>`<datalist id="${id}">${arr.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>`;
  const vars=Object.keys(VARIANT_OWNER);
  return mk("dl-species",Object.keys(SP))+mk("dl-general",[...Object.values(TR).filter(x=>x.slot==="general").map(x=>x.name),...vars])+
    mk("dl-role",[...Object.values(TR).filter(x=>x.slot==="role").map(x=>x.name),...vars])+
    mk("dl-mut",Object.values(TR).filter(x=>x.slot==="mutation").map(x=>x.name))+mk("dl-stat",Object.values(TR).filter(x=>x.slot==="stat").map(x=>x.name));
}
function renderSimSlots(){
  const titles={L:t("sl_L"),R:t("sl_R"),M0:t("sl_M",{n:1}),M1:t("sl_M",{n:2}),M2:t("sl_M",{n:3})};
  $("sim-slots").innerHTML=datalists()+SLOT_KEYS.map(k=>{
    const it=getSlot(k); const parent=k==="L"||k==="R"; const kind=it?it.kind:"empty";
    const kinds=parent?[["dev",t("k_dev")],["empty",t("k_empty")]]:[["dev",t("k_dev")],["animal",t("k_animal")],["furn",t("k_furn")],["empty",t("k_empty")]];
    let body="";
    if(kind==="dev"){
      const known=!!SP[it.species];
      body=`<label for="${k}-sp">${t("f_species")}<input type="text" id="${k}-sp" list="dl-species" value="${esc(it.species)}" data-f="species"></label>
      ${known?"":`<label for="${k}-cat">${t("f_cat")}<select id="${k}-cat" data-f="cat">${["combat","territory","crafting"].map(v=>opt(v,CAT(v),v===it.cat)).join("")}</select></label>`}
      ${SLOTS.map(s=>`<label for="${k}-${s}">${SLOT_T(s)}<input type="text" id="${k}-${s}" list="${DL_ID[s]}" value="${esc(it.traits[s])}" data-f="t-${s}" placeholder="${t("ph_none")}"></label>`).join("")}
      <div class="row"><label for="${k}-sk">${t("sk")}<input type="number" min="1" max="5" id="${k}-sk" value="${it.sk}" data-f="sk"></label><label for="${k}-ac">${t("ac")}<input type="number" min="1" max="5" id="${k}-ac" value="${it.ac}" data-f="ac"></label></div>`;
    } else if(kind==="animal"||kind==="furn"){
      body=`<label for="${k}-mat">${t("f_item")}<select id="${k}-mat" data-f="name">${Object.keys(MATERIALS[kind]).map(n=>opt(n,matL(kind,n)+" → "+matT(kind,n),n===it.name)).join("")}</select></label>`;
    }
    return `<div class="slot ${parent?"parent":""}" data-k="${k}"><h4>${titles[k]}</h4>
      <label for="${k}-kind">${t("kind_lbl")}<select id="${k}-kind" data-f="kind">${kinds.map(([v,x])=>opt(v,x,v===kind)).join("")}</select></label>${body}</div>`;
  }).join("");
  $("sim-slots").querySelectorAll(".slot").forEach(el=>{
    const k=el.dataset.k;
    el.querySelectorAll("[data-f]").forEach(inp=>{
      const ev=inp.tagName==="SELECT"?"change":"input";
      inp.addEventListener(ev,()=>{
        const f=inp.dataset.f; const it=getSlot(k);
        if(f==="kind"){ const v=inp.value; setSlot(k, v==="empty"?null: v==="dev"? dev(Object.keys(SP)[0]) : mat(v,Object.keys(MATERIALS[v])[0])); renderSimSlots(); renderSim(); return; }
        if(!it) return;
        if(f==="species"){ it.species=inp.value.trim(); if(SP[it.species]) it.cat=SP[it.species].cat; }
        else if(f==="cat") it.cat=inp.value;
        else if(f.startsWith("t-")) it.traits[f.slice(2)]=inp.value.trim();
        else if(f==="sk"||f==="ac") it[f]=Math.max(1,Math.min(5,+inp.value||1));
        else if(f==="name") it.name=inp.value;
        renderSim();
      });
      if(inp.dataset.f==="species") inp.addEventListener("change",()=>{renderSimSlots(); renderSim();});
    });
  });
}
function renderSim(){
  const res=compute(SIM); let focusSel="";
  if(res.valid&&res.species.length>1){ if(!res.per[FOCUS]) FOCUS=res.species[0].s;
    focusSel=`<label for="sim-focus" style="max-width:280px">${t("focus")}<select id="sim-focus">${res.species.map(x=>opt(x.s,x.s,x.s===FOCUS)).join("")}</select></label>`; }
  else if(res.valid) FOCUS=res.species[0].s;
  $("sim-result").innerHTML=`<h2 style="font-size:18px">${t("res_h")}</h2>${focusSel}${resultHTML(res,FOCUS)}`;
  const fs=$("sim-focus"); if(fs) fs.onchange=()=>{FOCUS=fs.value; renderSim();};
}
function simExample(){
  const V=CFG.vslot;
  loadSim({L:dev("Electric Eel",{[V]:"Golden Lightning",mutation:"Moonlight Assault"},3,3,"Golden Eel + Moonlight Assault"),
    R:dev("Electric Eel",{[V]:"Golden Lightning"},3,3,"Golden Eel"),
    M:[dev("Lonewolf's Whisper",{general:"Feeling Blue 1",stat:"Attack Percentage 3"},3,3,"Lonewolf AP3 + Feeling Blue"),
       dev("Electric Eel",{[V]:"Golden Lightning",mutation:"Moonlight Assault"},3,3,"Golden Eel + Moonlight Assault"),
       dev("Shattered Maiden",{general:"Cheer Up 3",stat:"Attack Percentage 3"},3,3,"Maiden Cheer Up + AP3")]});
}

/* ================= REFERENCE ================= */
function renderRef(){
  const q=$("ref-q").value.trim().toLowerCase(), sl=$("ref-slot").value, kd=$("ref-kind").value;
  const rows=[];
  Object.values(TR).forEach(x=>rows.push({n:x.name,slot:SLOT_T(x.slot)+(x.cat?" · "+CAT(x.cat):""),sk:x.slot,e:tx(x.effect),k:x.kind,
    src:x.slot==="mutation"?(MAT_FOR_TRAIT[x.name]?matL(MAT_FOR_TRAIT[x.name].kind,MAT_FOR_TRAIT[x.name].name):t("src_unknown")):x.slot==="stat"?t("src_scp"):t("src_any")}));
  Object.entries(VARIANT_OWNER).forEach(([n,owners])=>rows.push({n,slot:t("variant_slot_lbl",{slot:SLOT_T(CFG.vslot)}),sk:"variant",e:tx(VARIANT_EFFECT[n]),k:"good",src:t("src_locked",{x:owners.join(", ")})}));
  const f=rows.filter(r=>(!sl||r.sk===sl)&&(!kd||r.k===kd)&&(!q||(r.n+" "+r.e+" "+r.src).toLowerCase().includes(q)));
  const kb={good:`<span class="badge b-good">${t("b_good")}</span>`,mixed:`<span class="badge b-mixed">${t("b_mixed")}</span>`,bad:`<span class="badge b-bad">${t("b_bad")}</span>`};
  $("ref-table").innerHTML=`<thead><tr><th>${t("th_trait")}</th><th>${t("th_slot")}</th><th>${t("th_eff")}</th><th>${t("th_kind")}</th><th>${t("th_src")}</th></tr></thead><tbody>`+
    f.map(r=>`<tr><td><b>${esc(r.n)}</b></td><td>${esc(r.slot)}</td><td>${esc(r.e)}</td><td>${kb[r.k]}</td><td>${esc(r.src)}</td></tr>`).join("")+
    (f.length?"":`<tr><td colspan="5" class="note">${t("ref_empty")}</td></tr>`)+"</tbody>";
}

/* ================= SAVE / OPEN ================= */
function planData(){
  const w=readWant();
  const steps=(LAST_PLAN?LAST_PLAN.plan.steps:[]).map((s,i)=>({step:i+1,title:s.title,how:s.why,
    odds:{species:pct((s.res.species.find(x=>x.s===s.want.species)||{p:0}).p),all:s.p!=null?pct(s.p):null}}));
  return {app:"once-human-fusion-planner",version:1,savedAt:new Date().toISOString(),lang:LANG,server:SERVER,target:w,settings:CFG,simulator:SIM,readable_steps:steps};
}
const fileName=()=>`fusion-plan-${$("pl-species").value.replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
async function savePlan(){
  const data=JSON.stringify(planData(),null,2), fn=fileName();
  try{
    if(window.claude&&typeof window.claude.use==="function"){
      const d=await window.claude.use("downloads");
      if(d){ await d.save({filename:fn,data}); toast(t("saved",{f:fn})); return; }
      throw new Error("no downloads");
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=fn;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast(t("saved",{f:fn}));
  }catch(e){ openModal("save",data); }
}
function applyPlan(obj){
  if(!obj||obj.app!=="once-human-fusion-planner"||!obj.target||!SP[obj.target.species]) throw new Error("bad");
  if(obj.settings) { CFG={...DEF,...obj.settings}; saveCfg(); renderCfg(); }
  setServer(obj.server==="scp"?"scp":"normal");
  $("pl-species").value=obj.target.species; syncPlannerDeps(obj.target);
  ["general","role","mut","stat"].forEach(k=>{ const el=$("pl-"+k); if(obj.target[k]!==undefined&&[...el.options].some(o=>o.value===obj.target[k])) el.value=obj.target[k]; });
  renderPlan();
  if(obj.simulator) loadSim({L:obj.simulator.L,R:obj.simulator.R,M:obj.simulator.M||[null,null,null]});
  toast(t("loaded"));
}
function loadText(txt){ try{ applyPlan(JSON.parse(txt)); return true; }catch(e){ toast(t("load_err"),true); return false; } }
let MODE="";
function openModal(mode,text){
  MODE=mode; $("modal-h").textContent=mode==="save"?t("m_save_h"):t("m_paste_h");
  $("modal-note").textContent=mode==="save"?t("m_save_note"):t("m_paste_note");
  $("modal-text").value=text||""; $("modal-text").readOnly=mode==="save";
  $("modal-load").style.display=mode==="save"?"none":""; $("modal-copy").style.display=mode==="save"?"":"none";
  $("modal").classList.add("on"); $("modal-text").focus(); if(mode==="save") $("modal-text").select();
}
const closeModal=()=>$("modal").classList.remove("on");

/* ================= CONFIG UI ================= */
function renderCfg(){ ["base","step","cap","up","down","vslot"].forEach(k=>$("cfg-"+k).value=CFG[k]); }

/* ================= LANGUAGE ================= */
function applyStatic(){
  document.documentElement.lang=LANG==="zh"?"zh-Hans":LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $("lang").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG?"true":"false"));
}
function setLang(l){
  LANG=l; try{localStorage.setItem("fp-lang",l);}catch(e){}
  const keep=readWant(); applyStatic(); fillPlannerSelects(keep); renderPlan(); renderSimSlots(); renderSim(); renderRef();
}

/* ================= WIRING ================= */
function showTab(p){ document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x.dataset.p===p?"true":"false"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.toggle("on",x.id==="p-"+p)); }
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>showTab(x.dataset.p));
$("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("pl-species").addEventListener("change",()=>{syncPlannerDeps({general:$("pl-general").value,mut:$("pl-mut").value,stat:$("pl-stat").value}); renderPlan();});
["pl-variant","pl-event","pl-general","pl-role","pl-mut","pl-stat","pl-carrier"].forEach(id=>$(id).addEventListener("change",renderPlan));
$("pl-server").querySelectorAll("button").forEach(b=>b.onclick=()=>{ setServer(b.dataset.v); const keep=readWant(); keep.carrier=""; syncPlannerDeps(keep); renderPlan(); });
$("pl-preset").onclick=()=>{ setServer("scp"); CFG.vslot="role"; saveCfg(); renderCfg(); $("pl-species").value="Butterfly's Emissary";
  syncPlannerDeps({variant:"Praise the Moon – Starry Night",general:"Power Rewind 2",role:"",mut:"Moonlight Assault",stat:"Crit DMG 3",carrier:"Polar Jelly",event:""}); renderPlan(); };
$("ref-q").addEventListener("input",renderRef); $("ref-slot").addEventListener("change",renderRef); $("ref-kind").addEventListener("change",renderRef);
$("sim-clear").onclick=()=>loadSim({L:null,R:null,M:[null,null,null]});
$("sim-example").onclick=simExample;
["base","step","cap","up","down"].forEach(k=>$("cfg-"+k).addEventListener("input",e=>{const v=parseFloat(e.target.value); if(!isNaN(v)){CFG[k]=v; saveCfg(); renderPlan(); renderSim();}}));
$("cfg-vslot").addEventListener("change",e=>{CFG.vslot=e.target.value; saveCfg(); renderPlan(); simExample(); renderRef();});
$("cfg-reset").onclick=()=>{CFG={...DEF}; saveCfg(); renderCfg(); renderPlan(); renderSim(); renderRef();};
$("btn-save").onclick=savePlan;
$("btn-paste").onclick=()=>openModal("paste","");
$("file-in").addEventListener("change",async e=>{ const f=e.target.files[0]; if(!f) return; loadText(await f.text()); e.target.value=""; });
$("modal-close").onclick=closeModal;
$("modal").addEventListener("click",e=>{ if(e.target===$("modal")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
$("modal-load").onclick=()=>{ if(loadText($("modal-text").value)) closeModal(); };
$("modal-copy").onclick=async()=>{ try{ await navigator.clipboard.writeText($("modal-text").value); toast(t("copied")); }catch(e){ $("modal-text").select(); } };

applyStatic(); fillPlannerSelects(); renderCfg(); renderPlan(); simExample(); renderRef();
</script>
</body>
